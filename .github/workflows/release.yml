name: Manual Release Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Nomor Versi Rilis (misal: v1.0.0)'
        required: true
        default: 'v1.0.0'
      release_notes:
        description: 'Catatan Perubahan (Release Notes)'
        required: false
        default: 'Rilis resmi aplikasi Marked Notes berbasis React Native Expo'
      build_target:
        description: 'Target Build'
        required: true
        default: 'web'
        type: choice
        options:
          - 'web'
          - 'all'

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📦 Install Dependencies
        run: npm ci || npm install

      - name: 🔐 Generate App Security Hash & Checksum File
        run: |
          mkdir -p release_assets
          HASH=$(node -e 'console.log(require("crypto").createHash("sha256").update("MARKED_NOTES_APP_MARKED_NOTES_SECURE_SALT_v1_2026_EXPO_V57").digest("hex").toUpperCase())')
          echo "APP_SECURITY_HASH=$HASH" > release_assets/APP_SECURITY_HASH.txt
          echo "RELEASE_VERSION=${{ github.event.inputs.version }}" >> release_assets/APP_SECURITY_HASH.txt
          echo "BUILD_TIMESTAMP=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> release_assets/APP_SECURITY_HASH.txt
          echo "MIN_ANDROID_SDK=24 (Android 7.0+)" >> release_assets/APP_SECURITY_HASH.txt
          echo "App Security Hash: $HASH"

      - name: 🏗️ Build Production Bundle (Web)
        run: |
          npx expo export --platform web
          cd dist && zip -r ../release_assets/markednotes-web-production.zip . && cd ..

      - name: 🏷️ Create GitHub Release & Upload Artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: Marked Notes ${{ github.event.inputs.version }}
          body: |
            ## 🚀 Marked Notes ${{ github.event.inputs.version }}
            ${{ github.event.inputs.release_notes }}

            ---
            ### 🤖 Compatibility & Security
            - **Android Minimum**: Android 7.0+ (`minSdkVersion 24`)
            - **App Security Hash**: `markednotes-app-sha256`
            - Checksum verification file included: `APP_SECURITY_HASH.txt`
          files: |
            release_assets/markednotes-web-production.zip
            release_assets/APP_SECURITY_HASH.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
