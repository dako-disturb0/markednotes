name: CI Debug Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  typecheck-and-lint:
    name: Type Check & Verify
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci || npm install

      - name: 🔍 TypeScript Verification
        run: npx tsc --noEmit

  build-debug-web:
    name: Build Debug Bundle
    needs: typecheck-and-lint
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci || npm install

      - name: 🚀 Build Debug Export (Web Bundle)
        run: npx expo export --platform web

      - name: 🔐 Generate App Security Hash
        run: |
          echo "Generating Security Fingerprint..."
          echo "APP_HASH=$(node -e 'console.log(require("crypto").createHash("sha256").update("MARKED_NOTES_APP_MARKED_NOTES_SECURE_SALT_v1_2026_EXPO_V57").digest("hex").toUpperCase())')" >> $GITHUB_ENV

      - name: 📤 Upload Debug Artifact
        uses: actions/upload-artifact@v4
        with:
          name: markednotes-debug-web-${{ github.sha }}
          path: dist/
          retention-days: 7
